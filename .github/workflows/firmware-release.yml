name: Publish firmware
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Verify staged release files and publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for file in SHA256SUMS input-commit notes.md; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GH_REPO/contents/releases/$TAG/$file?ref=$TAG" > "$file"
          done
          git init -q inputs
          git -C inputs fetch --depth=1 "https://github.com/$GH_REPO.git" "refs/heads/release-inputs/$TAG"
          test "$(git -C inputs rev-parse FETCH_HEAD)" = "$(cat input-commit)"
          git -C inputs checkout -q --detach FETCH_HEAD
          image="cardputerzero-$TAG-sdcard.img.xz"
          sources="czlite-$TAG-sources.tar.gz"
          cp "inputs/$image" .
          cat inputs/source-part-* > "$sources"
          sha256sum -c SHA256SUMS
          xz -t "$image"
          tar -tzf "$sources" > /dev/null
          gh release create "$TAG" --verify-tag --draft --title "czlite $TAG" \
            --notes-file notes.md "$image" "$sources" SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
